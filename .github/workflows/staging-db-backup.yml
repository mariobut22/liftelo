name: Staging DB backup

on:
  workflow_dispatch:

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PATH: /home/1638914.cloudwaysapps.com/evvscefxqb/public_html
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Dump database (staging only)
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "TARGET_PATH='$TARGET_PATH' bash -s" <<'REMOTE' || {
          # No `set -e`: every step is checked explicitly so the log names the failing step.
          set -uo pipefail
          umask 077
          STEP="start"
          step() { STEP="$1"; echo "==> $STEP"; }
          fail() { echo "ERROR: step '$STEP' failed: $1" >&2; exit 1; }

          step "check required tools"
          command -v mysqldump >/dev/null 2>&1 || fail "mysqldump not found in PATH"
          command -v gzip >/dev/null 2>&1 || fail "gzip not found in PATH"

          step "read DB settings from backend/.env"
          ENV_FILE="$TARGET_PATH/backend/.env"
          [ -r "$ENV_FILE" ] || fail "$ENV_FILE does not exist or is not readable"
          # Read only DB_* keys; a missing key gives an empty value (no pipefail abort);
          # never source the whole file and never print values.
          getenv() { { grep -E "^$1=" "$ENV_FILE" || true; } | head -n1 | cut -d= -f2- | tr -d '\r' | sed -e 's/^["'\'']//' -e 's/["'\'']$//'; }
          DB_HOST="$(getenv DB_HOST)"; DB_PORT="$(getenv DB_PORT)"
          DB_USER="$(getenv DB_USER)"; DB_NAME="$(getenv DB_NAME)"
          DB_PASSWORD="$(getenv DB_PASSWORD)"
          [ -n "$DB_USER" ] || fail "DB_USER is missing or empty in backend/.env"
          [ -n "$DB_NAME" ] || fail "DB_NAME is missing or empty in backend/.env"
          [ -n "$DB_PASSWORD" ] || fail "DB_PASSWORD is missing or empty in backend/.env"
          [ -n "$DB_HOST" ] || { DB_HOST=localhost; echo "DB_HOST not set in backend/.env, using localhost"; }
          [ -n "$DB_PORT" ] || { DB_PORT=3306; echo "DB_PORT not set in backend/.env, using 3306"; }
          export MYSQL_PWD="$DB_PASSWORD"
          unset DB_PASSWORD
          echo "Target database: $DB_NAME (port $DB_PORT)"

          step "create backup directory"
          BACKUP_DIR="$HOME/db-backups"
          mkdir -p "$BACKUP_DIR" || fail "cannot create $BACKUP_DIR"
          OUT="$BACKUP_DIR/staging_${DB_NAME}_$(date +%Y%m%d_%H%M%S).sql.gz"
          ERR="$(mktemp)" || fail "cannot create temp file"
          trap 'rm -f "$ERR"' EXIT

          step "mysqldump | gzip"
          mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --single-transaction --routines --triggers --no-tablespaces "$DB_NAME" 2>"$ERR" | gzip > "$OUT"
          rc=("${PIPESTATUS[@]}")
          if [ "${rc[0]}" -ne 0 ] || [ "${rc[1]}" -ne 0 ]; then
            echo "mysqldump exit ${rc[0]}, gzip exit ${rc[1]}" >&2
            echo "--- mysqldump stderr ---" >&2
            sed -e 's/^/  /' "$ERR" >&2
            rm -f "$OUT"
            fail "dump did not complete"
          fi

          step "verify backup file"
          [ -s "$OUT" ] || fail "backup file is empty"
          gzip -t "$OUT" || fail "backup file is not a valid gzip archive"
          echo "Backup: $(basename "$OUT") ($(du -h "$OUT" | cut -f1))"
          REMOTE
            rc=$?
            echo "::error::Remote backup script failed (ssh exit $rc). See the 'ERROR: step ...' line above."
            exit "$rc"
          }
