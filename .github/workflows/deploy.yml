name: Deploy Liftelo

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_PATH: /home/1638914.cloudwaysapps.com/evvscefxqb/public_html
      PM2_PROCESS: liftelo-staging
      APP_URL: https://staging.liftelo.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend source
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'node_modules' \
            backend/ "$SSH_USER@$SSH_HOST:$TARGET_PATH/backend/"

      - name: Publish frontend dist
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "rm -rf '$TARGET_PATH/assets' '$TARGET_PATH/index.html' '$TARGET_PATH/vite.svg'"
          rsync -az frontend/dist/ "$SSH_USER@$SSH_HOST:$TARGET_PATH/"

      - name: Restart process and verify
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd '$TARGET_PATH/backend' && npm install --omit=dev --no-audit --no-fund && npx pm2 restart '$PM2_PROCESS' --update-env"
          curl -f -s -o /dev/null "$APP_URL/"
          curl -f -s -o /dev/null "$APP_URL/api/login/check" || true

  deploy_production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_PATH: /home/1638914.cloudwaysapps.com/uvwgtbybmm/public_html
      PM2_PROCESS: liftelo
      APP_URL: https://app.liftelo.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend source
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'node_modules' \
            backend/ "$SSH_USER@$SSH_HOST:$TARGET_PATH/backend/"

      - name: Publish frontend dist
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "rm -rf '$TARGET_PATH/assets' '$TARGET_PATH/index.html' '$TARGET_PATH/vite.svg'"
          rsync -az frontend/dist/ "$SSH_USER@$SSH_HOST:$TARGET_PATH/"

      - name: Restart process and verify
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd '$TARGET_PATH/backend' && npm install --omit=dev --no-audit --no-fund && npx pm2 restart '$PM2_PROCESS' --update-env"
          curl -f -s -o /dev/null "$APP_URL/"
          curl -f -s -o /dev/null "$APP_URL/api/login/check" || true
