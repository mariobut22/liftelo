name: Staging migrate

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'SQL file name from backend/migrations (e.g. 20261027_add_stripe_billing_mvp.sql)'
        required: true
        type: string

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PATH: /home/1638914.cloudwaysapps.com/evvscefxqb/public_html
      MIGRATION: ${{ inputs.migration }}
    steps:
      - name: Validate input
        run: |
          if ! [[ "$MIGRATION" =~ ^[A-Za-z0-9_.-]+\.sql$ ]]; then
            echo "Invalid migration file name"; exit 1
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Backup, then apply migration (staging only)
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "TARGET_PATH='$TARGET_PATH' MIGRATION='$MIGRATION' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          ENV_FILE="$TARGET_PATH/backend/.env"
          FILE="$TARGET_PATH/backend/migrations/$MIGRATION"
          [ -f "$FILE" ] || { echo "Migration not found on server: $MIGRATION (deploy develop first)"; exit 1; }
          getenv() { grep -E "^$1=" "$ENV_FILE" | head -n1 | cut -d= -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//'; }
          DB_HOST="$(getenv DB_HOST)"; DB_USER="$(getenv DB_USER)"
          DB_NAME="$(getenv DB_NAME)"; DB_PORT="$(getenv DB_PORT)"
          export MYSQL_PWD="$(getenv DB_PASSWORD)"
          mkdir -p "$HOME/db-backups"
          OUT="$HOME/db-backups/staging_${DB_NAME}_premigrate_$(date +%Y%m%d_%H%M%S).sql.gz"
          mysqldump -h "${DB_HOST:-localhost}" -P "${DB_PORT:-3306}" -u "$DB_USER" \
            --single-transaction --routines --triggers --no-tablespaces "$DB_NAME" | gzip > "$OUT"
          echo "Backup: $(basename "$OUT") ($(du -h "$OUT" | cut -f1))"
          echo "Applying $MIGRATION"
          mysql -h "${DB_HOST:-localhost}" -P "${DB_PORT:-3306}" -u "$DB_USER" "$DB_NAME" < "$FILE"
          echo "Migration applied"
          REMOTE
