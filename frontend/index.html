<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Liftelo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Liftelo</title>
    <script>
      /* Theme before first paint (no flash). Keep in sync with src/lib/theme.ts. */
      (function () {
        try {
          var pref = null;
          try { pref = localStorage.getItem('liftelo-theme'); } catch (e) {}
          var dark = pref === 'dark' || ((pref !== 'light') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) { root.classList.add('dark'); root.style.colorScheme = 'dark'; }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#18181b');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
