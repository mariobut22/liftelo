<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifteloApp Registracija</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

  <div class="card shadow p-4" style="width: 100%; max-width: 480px;">
    <h2 class="text-center mb-4">🏢 Otvori tvrtku</h2>

    <form id="signup-form">
      <div class="mb-3">
        <label for="company_name" class="form-label">Naziv tvrtke:</label>
        <input type="text" name="company_name" id="company_name" class="tw-input" required />
      </div>
      <div class="mb-3">
        <label for="full_name" class="form-label">Ime i prezime:</label>
        <input type="text" name="full_name" id="full_name" class="tw-input" required />
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Korisničko ime / Email:</label>
        <input type="text" name="username" id="username" class="tw-input" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Lozinka:</label>
        <input type="password" name="password" id="password" class="tw-input" required minlength="6" />
      </div>

      <button type="submit" class="tw-btn-primary w-100">Kreiraj tvrtku</button>
      <div id="poruka" class="mt-3 text-center text-danger"></div>
    </form>

    <div class="text-center mt-3">
      <a href="/login" class="text-decoration-none">Već imate račun? Prijavite se</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/signup.js"></script>
</body>
</html>
