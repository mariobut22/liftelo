<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Moj profil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Moj profil">
  <header></header>
  <div class="container mt-5">
    <h2>👤 Moj profil</h2>
<li><a href="/dashboard/profile.html">👤 Moj profil</a></li>

    <div class="mb-3">
      <label class="form-label">Korisničko ime:</label>
      <input type="text" id="username" class="tw-input" readonly />
    </div>

    <div class="mb-3">
      <label class="form-label">Ime i prezime:</label>
      <input type="text" id="full_name" class="tw-input" readonly />
    </div>

    <div class="mb-3">
      <label class="form-label">Uloga:</label>
      <input type="text" id="role" class="tw-input" readonly />
    </div>

    <hr />

    <h4>🔐 Promjena lozinke</h4>

    <form id="password-form">
      <div class="mb-3">
        <label class="form-label">Trenutna lozinka:</label>
        <input type="password" class="tw-input" id="currentPassword" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Nova lozinka:</label>
        <input type="password" class="tw-input" id="newPassword" minlength="8" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Ponovi novu lozinku:</label>
        <input type="password" class="tw-input" id="confirmPassword" minlength="8" required />
      </div>

      <button type="submit" class="tw-btn-primary">Promijeni lozinku</button>
    </form>
  </div>

  <script src="/dashboard/nav.js"></script>
  <script src="/dashboard/profile.js"></script>
</body>
</html>
