<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projekt | Liftelo</title>
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Projekt">

  <header></header>

  <main class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8 project-detail-page">
    <section class="project-detail-hero">
      <div class="w-full">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-2xl font-semibold text-slate-900" id="projectTitle">Projekt</h2>
          <span id="project-progress-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-200 text-gray-700">0%</span>
        </div>
        <p class="text-sm text-slate-500" id="projectStatus">—</p>
        <div class="mt-3">
          <div class="w-full bg-gray-200 rounded-full h-1">
            <div id="project-progress-bar" class="h-1 rounded-full transition-all duration-300 ease-in-out" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="project-detail-actions">
        <button type="button" class="tw-btn-secondary" id="backToProjects">⬅️ Povratak</button>
      </div>
    </section>

    <section class="project-detail-card">
      <h3>Osnovni podaci</h3>
      <div class="project-detail-info">
        <div><span class="text-slate-500">Naziv:</span> <span id="projectName">—</span></div>
        <div><span class="text-slate-500">Opis:</span> <span id="projectDescription">—</span></div>
        <div><span class="text-slate-500">Lokacija:</span> <span id="projectLocation">—</span></div>
        <div><span class="text-slate-500">Status:</span> <span id="projectStatusValue">—</span></div>
        <div><span class="text-slate-500">Datum početka:</span> <span id="projectStartDate">—</span></div>
        <div><span class="text-slate-500">Očekivani završetak:</span> <span id="projectExpectedEnd">—</span></div>
        <div><span class="text-slate-500">Kreirao:</span> <span id="projectCreatedBy">—</span></div>
        <div><span class="text-slate-500">Kreirano:</span> <span id="projectCreatedAt">—</span></div>
      </div>
    </section>

    <section class="project-detail-card">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <h3>Sekcije i taskovi</h3>
        <button type="button" class="tw-btn-primary" id="addSectionBtn" data-admin-only>+ Dodaj sekciju</button>
      </div>
      <div id="projectSections" class="space-y-4"></div>
      <div id="projectSectionsEmpty" class="text-sm text-slate-500">Nema sekcija u projektu.</div>
    </section>
  </main>

  <div id="projectSectionModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6" data-modal-open="false" data-admin-only>
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="projectSectionModal"></div>
    <div class="relative bg-white w-full max-w-2xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900">Nova sekcija</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('projectSectionModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <form id="projectSectionForm" class="space-y-4">
          <div>
            <label class="form-label">Naziv sekcije</label>
            <input type="text" id="projectSectionTitle" class="tw-input" required />
          </div>
          <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="tw-btn-secondary" onclick="closeModal('projectSectionModal')">Odustani</button>
            <button type="submit" class="tw-btn-primary">Spremi sekciju</button>
          </div>
        </form>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('projectSectionModal')">Odustani</button>
        <button type="submit" class="tw-btn-primary" form="projectSectionForm">Spremi sekciju</button>
      </footer>
    </div>
  </div>

  <div id="projectTaskModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6" data-modal-open="false" data-admin-only>
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="projectTaskModal"></div>
    <div class="relative bg-white w-full max-w-2xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900">Novi task</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('projectTaskModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <form id="projectTaskForm" class="space-y-4">
          <input type="hidden" id="projectTaskSectionId" />
          <input type="hidden" id="projectTaskId" />
          <div>
            <label class="form-label">Naziv taska</label>
            <input type="text" id="projectTaskTitle" class="tw-input" />
          </div>
          <div>
            <label class="form-label">Opis</label>
            <textarea id="projectTaskDescription" class="tw-input" rows="3" placeholder="Opis taska..."></textarea>
          </div>
          <div>
            <label class="form-label">Dodijeli korisnike</label>
            <div id="projectTaskAssignees" class="project-assignee-list"></div>
          </div>
          <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="tw-btn-secondary" onclick="closeModal('projectTaskModal')">Odustani</button>
            <button type="submit" class="tw-btn-primary">Spremi task</button>
          </div>
        </form>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('projectTaskModal')">Odustani</button>
        <button type="submit" class="tw-btn-primary" form="projectTaskForm">Spremi task</button>
      </footer>
    </div>
  </div>

  <script src="/dashboard/project-detail.js"></script>
  <script src="/dashboard/nav.js"></script>
</body>
</html>
