<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tvrtka – Liftelo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Tvrtka">

  <header></header>

  <main class="container">
    <h2 class="mb-4">🏢 Tvrtka</h2>

    <section class="card shadow-sm">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="text-muted text-uppercase small">Naziv</div>
            <div id="companyName" class="fw-semibold">—</div>
          </div>
          <div class="col-md-3">
            <div class="text-muted text-uppercase small">ID</div>
            <div id="companyId" class="fw-semibold">—</div>
          </div>
          <div class="col-md-3">
            <div class="text-muted text-uppercase small">Kreirano</div>
            <div id="companyCreated" class="fw-semibold">—</div>
          </div>
        </div>
      </div>
    </section>

    <section class="card shadow-sm mt-4">
      <div class="card-body">
        <h3 class="h5 mb-3">Logo tvrtke</h3>
        <div class="d-flex flex-column gap-3">
          <div id="companyLogoPreview" class="d-flex align-items-center gap-3">
            <span id="companyLogoPlaceholder" class="text-muted">Logo nije postavljen</span>
            <img id="companyLogoImage" src="" alt="Logo tvrtke" class="d-none" style="max-height: 90px; width: auto; object-fit: contain;" />
          </div>
          <form id="companyLogoForm" class="d-none">
            <div class="mb-2">
              <label class="form-label">Upload logo</label>
              <input type="file" id="companyLogoInput" name="logo" class="tw-input" accept="image/png,image/jpeg" />
              <small class="text-muted">PNG ili JPG, max 1MB</small>
            </div>
            <button type="submit" class="tw-btn-primary">Upload logo</button>
            <div id="companyLogoMessage" class="mt-2 text-sm"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="/dashboard/company.js"></script>
  <script src="/dashboard/nav.js"></script>
</body>
</html>
