<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radni nalozi | Liftelo</title>
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Radni nalozi">

  <header></header>

  <main class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">
      <h2 class="text-2xl font-semibold text-slate-900">Radni nalozi</h2>
      <button type="button" class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700" data-admin-only data-modal-target="workOrderModal">
        ➕ Novi radni nalog
      </button>
    </div>

    <section>
      <div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="p-6">
          <div class="overflow-x-auto">
            <table id="work-orders-table" class="w-full text-left text-sm">
              <thead class="border-b border-slate-200 text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="py-3 pr-4">Lokacija</th>
                  <th class="py-3 pr-4">Rok</th>
                  <th class="py-3 pr-4">Dodijeljeni</th>
                  <th class="py-3 pr-4">Status</th>
                  <th class="py-3">Akcije</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <!-- Dinamički -->
              </tbody>
            </table>
          </div>

          <div id="work-orders-empty-state" class="empty-state d-none">
            <div class="empty-state-icon"><i class="bi bi-clipboard"></i></div>
            <h4>Nema radnih naloga</h4>
            <p>Dodaj prvi radni nalog kako bi se pojavio u listi.</p>
            <button type="button" class="tw-btn-primary" data-admin-only data-modal-target="workOrderModal">➕ Novi radni nalog</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="workOrderModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6" data-modal-open="false">
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="workOrderModal"></div>
    <div class="relative bg-white w-full max-w-2xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900">Novi radni nalog</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('workOrderModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <form id="workOrderForm" class="space-y-4">
          <div>
            <label class="form-label">Lokacija</label>
            <input type="text" id="workOrderLocation" autocomplete="off" list="workOrderLocationsList" class="tw-input" />
            <datalist id="workOrderLocationsList"></datalist>
            <ul id="workOrderLocationSuggestions" class="list-group"></ul>
          </div>

          <div>
            <label class="form-label">Dizala</label>
            <div id="workOrderElevators" class="grid gap-2 sm:grid-cols-2"></div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label class="form-label mb-0">Stavke</label>
              <button type="button" class="tw-btn-secondary" id="addWorkOrderItem">➕ Dodaj stavku</button>
            </div>
            <div id="workOrderItems" class="space-y-2 mt-3"></div>
          </div>

          <div>
            <label class="form-label">Opća napomena</label>
            <textarea id="workOrderComment" class="tw-input" rows="3" placeholder="Kratki opis ili napomena..."></textarea>
          </div>

          <div>
            <label class="form-label">Datum izdavanja</label>
            <input type="date" id="workOrderIssuedDate" class="tw-input" />
          </div>

          <div>
            <label class="form-label">Rok</label>
            <input type="date" id="workOrderDueDate" class="tw-input" />
          </div>

          <div>
            <label class="form-label">Dodijeli korisnike</label>
            <div id="workOrderUsers" class="grid gap-2 sm:grid-cols-2"></div>
          </div>

          <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="tw-btn-secondary" onclick="closeModal('workOrderModal')">Odustani</button>
            <button type="submit" class="tw-btn-primary">Spremi nalog</button>
          </div>
        </form>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('workOrderModal')">Odustani</button>
        <button type="submit" class="tw-btn-primary" form="workOrderForm">Spremi nalog</button>
      </footer>
    </div>
  </div>

  <script src="/dashboard/js/modal.js"></script>
  <script src="/dashboard/work-orders.js"></script>
  <script src="/dashboard/nav.js"></script>
</body>
</html>
