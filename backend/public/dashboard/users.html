<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Korisnici – Liftelo</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Korisnici">

  <header></header>

  <main class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8 users-page">
    <div class="users-header">
      <h2 class="mb-0">👤 Korisnici</h2>
      <button id="openAddUser" class="tw-btn-primary" data-admin-only>+ Dodaj korisnika</button>
    </div>

    <!-- 📋 TABLICA KORISNIKA -->
    <section class="users-card">
      <div class="table-responsive">
        <table id="users-table" class="table table-striped table-bordered users-table">
          <thead class="table-dark">
            <tr>
              <th>Ime</th>
              <th>Korisničko ime</th>
              <th>Uloga</th>
              <th>Status</th>
              <th class="users-actions-col">Akcije</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ➕ MODAL ZA DODAVANJE -->
  <div id="addUserModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6" data-modal-open="false" data-admin-only>
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="addUserModal"></div>
    <div class="relative bg-white w-full max-w-2xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900">Novi korisnik</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('addUserModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <form id="newUserForm" class="space-y-4" action="javascript:void(0)">
          <div>
            <label class="form-label">Korisničko ime</label>
            <input type="text" id="username" class="tw-input" placeholder="Korisničko ime" required />
          </div>
          <div>
            <label class="form-label">Puno ime</label>
            <input type="text" id="fullname" class="tw-input" placeholder="Puno ime" required />
          </div>
          <div>
            <label class="form-label">Pozivnica</label>
            <div class="text-sm text-slate-500">Korisnik će dobiti link za postavljanje lozinke.</div>
          </div>
          <div>
            <label class="form-label">Uloga</label>
            <select id="role" class="tw-select" required>
              <option value="technician">Serviser</option>
              <option value="admin">Administrator</option>
            </select>
          </div>
          <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="tw-btn-secondary" onclick="closeModal('addUserModal')">Odustani</button>
            <button type="submit" class="tw-btn-primary">Dodaj</button>
          </div>
        </form>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('addUserModal')">Odustani</button>
        <button type="submit" class="tw-btn-primary" form="newUserForm">Dodaj</button>
      </footer>
    </div>
  </div>

  <div id="inviteLinkModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6">
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="inviteLinkModal"></div>
    <div class="relative bg-white w-full max-w-xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900">Invite link</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('inviteLinkModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body" id="inviteLinkContainer">
        <label class="form-label">Link za postavljanje lozinke</label>
        <div class="flex items-center gap-2">
          <input type="text" id="inviteLinkInput" class="tw-input" readonly />
          <button type="button" class="tw-btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('inviteLinkInput').value)">Kopiraj</button>
        </div>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('inviteLinkModal')">Zatvori</button>
      </footer>
    </div>
  </div>

  <!-- JS -->
  <script src="/dashboard/users.js"></script>
  <script src="/dashboard/nav.js"></script>
  <script src="/dashboard/js/modal.js"></script>
</body>
</html>
