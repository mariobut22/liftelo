<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projekti | Liftelo</title>
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page-title="Projekti">

  <header></header>

  <main class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 projects-page">
    <div class="projects-header">
      <div>
        <h2 class="text-2xl font-semibold text-slate-900">📌 Projekti</h2>
        <p class="text-sm text-slate-500">Pregled aktivnih i završenih projekata.</p>
      </div>
      <button type="button" class="tw-btn-primary" id="addProjectBtn" data-admin-only>+ Novi projekt</button>
    </div>

    <section>
      <div id="projectsList" class="projects-grid"></div>
      <div id="projectsEmpty" class="empty-state d-none">
        <div class="empty-state-icon"><i class="bi bi-kanban"></i></div>
        <h4>Nema projekata</h4>
        <p>Dodaj prvi projekt kako bi se pojavio u listi.</p>
        <button type="button" class="tw-btn-primary" id="projectsEmptyAdd" data-admin-only>+ Novi projekt</button>
      </div>
    </section>
  </main>

  <div id="projectModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6" data-modal-open="false" data-admin-only>
    <div class="absolute inset-0 bg-black/40" data-modal-overlay="true" data-modal-id="projectModal"></div>
    <div class="relative bg-white w-full max-w-2xl sm:rounded-2xl shadow-xl h-full sm:h-auto sm:max-h-[85vh] overflow-hidden flex flex-col min-h-0">
      <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h5 class="text-lg font-semibold text-slate-900" id="projectModalTitle">Novi projekt</h5>
        <button type="button" class="text-slate-400 hover:text-slate-600" onclick="closeModal('projectModal')" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <form id="projectForm" class="space-y-4">
          <div>
            <label class="form-label">Naziv projekta</label>
            <input type="text" id="projectName" class="tw-input" required />
          </div>
          <div>
            <label class="form-label">Opis</label>
            <textarea id="projectDescription" class="tw-input" rows="3" placeholder="Kratki opis projekta..."></textarea>
          </div>
          <div>
            <label class="form-label">Lokacija</label>
            <select id="projectLocation" class="tw-select">
              <option value="">Bez lokacije</option>
            </select>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label class="form-label">Datum početka</label>
              <input type="date" id="projectStartDate" class="tw-input" />
            </div>
            <div>
              <label class="form-label">Očekivani završetak</label>
              <input type="date" id="projectExpectedEnd" class="tw-input" />
            </div>
          </div>
          <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="tw-btn-secondary" onclick="closeModal('projectModal')">Odustani</button>
            <button type="submit" class="tw-btn-primary">Spremi projekt</button>
          </div>
        </form>
      </div>
      <footer class="p-4 border-t flex justify-end gap-2 sm:hidden">
        <button type="button" class="tw-btn-secondary" onclick="closeModal('projectModal')">Odustani</button>
        <button type="submit" class="tw-btn-primary" form="projectForm">Spremi projekt</button>
      </footer>
    </div>
  </div>

  <script src="/dashboard/js/modal.js"></script>
  <script src="/dashboard/projects.js"></script>
  <script src="/dashboard/nav.js"></script>
</body>
</html>
