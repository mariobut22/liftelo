<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifteloApp Prijava</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">🔐 Prijava u sustav</h2>

    <form id="login-form"> <!-- VAŽNO: ID mora odgovarati JS fajlu -->
      <div class="mb-3">
        <label for="username" class="form-label">Korisničko ime:</label>
        <input type="text" name="username" id="username" class="tw-input" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Lozinka:</label>
        <input type="password" name="password" id="password" class="tw-input" required />
      </div>

      <button type="submit" class="tw-btn-primary w-100">Prijava</button>

      <div id="poruka" class="mt-3 text-center text-danger"></div>
    </form>
    <div class="text-center mt-3">
      <a href="/signup" class="text-decoration-none">Nemate račun? Otvorite tvrtku</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- OVA LINIJA MORA BITI TOČNA -->
  <script src="/dashboard/js/login.js"></script>
</body>
</html>
