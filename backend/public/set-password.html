<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postavi lozinku | Liftelo</title>
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="mx-auto w-full max-w-md px-4 sm:px-6 lg:px-8 py-10">
    <section class="project-detail-card">
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Postavi lozinku</h2>
      <p class="text-sm text-slate-500 mb-4">Unesi novu lozinku za aktivaciju računa.</p>
      <form id="setPasswordForm" class="space-y-4">
        <div>
          <label class="form-label">Nova lozinka</label>
          <input type="password" id="newPassword" class="tw-input" minlength="8" required />
        </div>
        <div>
          <label class="form-label">Potvrdi lozinku</label>
          <input type="password" id="confirmPassword" class="tw-input" minlength="8" required />
        </div>
        <button type="submit" class="tw-btn-primary w-full">Spremi lozinku</button>
      </form>
    </section>
  </main>
  <script src="/set-password.js"></script>
</body>
</html>
